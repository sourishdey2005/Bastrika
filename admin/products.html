<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Products | Admin</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>
    <div class="sidebar">
        <h2>BASTRIKA ADMIN</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="orders.html">Orders</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Manage Products</h1>
            <button class="action-btn btn-primary" onclick="openModal()">+ Add New Product</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                    <!-- Products will be loaded here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Product Modal (Add/Edit) -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add New Product</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <label>Product Name</label>
                <input type="text" id="name" placeholder="Enter product name" required>

                <label>Description</label>
                <textarea id="description" placeholder="Enter description" rows="3"></textarea>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label>Price (₹)</label>
                        <input type="number" id="price" placeholder="0.00" required>
                    </div>
                    <div>
                        <label>Stock</label>
                        <input type="number" id="stock" placeholder="0" required>
                    </div>
                </div>

                <label>Category</label>
                <select id="category"
                    style="width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 8px; outline: none;">
                    <option value="women">Women</option>
                    <option value="men">Men</option>
                    <option value="kids">Kids</option>
                    <option value="home">Home & Living</option>
                </select>

                <label>Image URL</label>
                <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg">

                <button type="submit" class="action-btn btn-primary" style="width: 100%; margin-top: 1rem;">Save
                    Product</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');

        if (!token) window.location.href = '../store/login.html';

        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products`);
                const products = await res.json();
                const tbody = document.getElementById('products-table-body');
                tbody.innerHTML = '';

                products.forEach(p => {
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${p.image_url}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"></td>
                            <td>${p.name}</td>
                            <td>${p.category || 'General'}</td>
                            <td>₹${p.price}</td>
                            <td>${p.stock}</td>
                            <td>
                                <button class="action-btn btn-edit" onclick="editProduct('${p.id}')">Edit</button>
                                <button class="action-btn btn-delete" onclick="deleteProduct('${p.id}')">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        function openModal(id = null) {
            const modal = document.getElementById('productModal');
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('modalTitle').innerText = 'Add New Product';
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        async function editProduct(id) {
            try {
                const res = await fetch(`${API_URL}/admin/products/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const p = await res.json();

                document.getElementById('productId').value = p.id;
                document.getElementById('name').value = p.name;
                document.getElementById('description').value = p.description;
                document.getElementById('price').value = p.price;
                document.getElementById('stock').value = p.stock;
                document.getElementById('category').value = p.category || 'women';
                document.getElementById('imageUrl').value = p.image_url;

                document.getElementById('modalTitle').innerText = 'Edit Product';
                document.getElementById('productModal').style.display = 'flex';
            } catch (err) { console.error(err); }
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            try {
                await fetch(`${API_URL}/admin/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadProducts();
            } catch (err) { console.error(err); }
        }

        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const data = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                stock: parseInt(document.getElementById('stock').value),
                category: document.getElementById('category').value,
                image_url: document.getElementById('imageUrl').value
            };

            const url = id ? `${API_URL}/admin/products/${id}` : `${API_URL}/admin/products`;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    closeModal();
                    loadProducts();
                } else {
                    const err = await res.json();
                    alert(err.message);
                }
            } catch (err) { console.error(err); }
        };

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '../store/login.html';
        }

        window.onload = loadProducts;
    </script>
</body>

</html>

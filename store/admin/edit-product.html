<!-- Add/Edit Product Admin - Desktop -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Edit Product | Bastrika Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e61919",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211111",
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light text-[#181111] font-display min-h-screen pb-24">
    <header
        class="flex items-center justify-between whitespace-nowrap border-b border-solid border-[#e5e7eb] bg-white px-10 py-3 sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <h2 class="text-[#181111] text-lg font-bold leading-tight tracking-tight">Bastrika <span
                    class="text-primary">Admin</span></h2>
            <nav class="flex items-center gap-9">
                <a class="text-[#181111]/60 hover:text-primary text-sm font-medium transition-colors"
                    href="dashboard.html">Dashboard</a>
                <a class="text-primary text-sm font-bold border-b-2 border-primary pb-1"
                    href="products.html">Products</a>
            </nav>
        </div>
    </header>

    <main class="max-w-[800px] mx-auto px-6 py-12">
        <div class="mb-8 flex items-center justify-between">
            <h1 id="page-title" class="text-3xl font-black text-[#181111] tracking-tight">Add New Product</h1>
            <a href="products.html" class="text-sm font-bold text-primary hover:underline">Back to List</a>
        </div>

        <form id="product-form" class="bg-white rounded-xl shadow-sm border border-[#e5e7eb] p-8 space-y-6">
            <div class="space-y-2">
                <label class="text-sm font-semibold text-[#374151]">Product Name</label>
                <input id="name" required
                    class="w-full px-4 py-3 rounded-lg border-[#d1d5db] focus:border-primary focus:ring-primary/20 transition-all"
                    placeholder="Handloom Silk Saree" type="text" />
            </div>
            <div class="space-y-2">
                <label class="text-sm font-semibold text-[#374151]">Description</label>
                <textarea id="description" required
                    class="w-full px-4 py-3 rounded-lg border-[#d1d5db] focus:border-primary focus:ring-primary/20 transition-all"
                    rows="5" placeholder="Detailed product story..."></textarea>
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-[#374151]">Price (₹)</label>
                    <input id="price" required
                        class="w-full px-4 py-3 rounded-lg border-[#d1d5db] focus:border-primary focus:ring-primary/20 transition-all"
                        type="number" step="0.01" />
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-[#374151]">Stock Quantity</label>
                    <input id="stock" required
                        class="w-full px-4 py-3 rounded-lg border-[#d1d5db] focus:border-primary focus:ring-primary/20 transition-all"
                        type="number" />
                </div>
            </div>
            <div class="space-y-2">
                <label class="text-sm font-semibold text-[#374151]">Category</label>
                <select id="category"
                    class="w-full px-4 py-3 rounded-lg border-[#d1d5db] focus:border-primary focus:ring-primary/20 transition-all">
                    <option value="women">Women</option>
                    <option value="men">Men</option>
                    <option value="kids">Kids</option>
                    <option value="home">Home & Living</option>
                </select>
            </div>
            <div class="space-y-2">
                <label class="text-sm font-semibold text-[#374151]">Image URL</label>
                <input id="image_url" required
                    class="w-full px-4 py-3 rounded-lg border-[#d1d5db] focus:border-primary focus:ring-primary/20 transition-all"
                    placeholder="https://..." type="url" />
            </div>

            <div class="pt-6">
                <button type="submit" id="submit-btn"
                    class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg hover:shadow-lg hover:shadow-primary/20 transition-all active:scale-[0.98]">
                    Create Product Listing
                </button>
            </div>
        </form>
    </main>

    <script src="../assets/js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');

        async function initForm() {
            if (productId) {
                document.getElementById('page-title').innerText = 'Edit Product';
                document.getElementById('submit-btn').innerText = 'Save Changes';
                try {
                    const product = await api.getProduct(productId);
                    if (product) {
                        document.getElementById('name').value = product.name;
                        document.getElementById('description').value = product.description;
                        document.getElementById('price').value = product.price;
                        document.getElementById('stock').value = product.stock;
                        document.getElementById('category').value = (product.category || 'women').toLowerCase();
                        document.getElementById('image_url').value = product.image_url;
                    }
                } catch (err) {
                    console.error(err);
                }
            }
        }

        document.getElementById('product-form').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                stock: parseInt(document.getElementById('stock').value),
                category: document.getElementById('category').value,
                image_url: document.getElementById('image_url').value
            };

            try {
                let res;
                if (productId) {
                    res = await api.updateProduct(productId, data);
                } else {
                    res = await api.createProduct(data);
                }

                if (res.id || res.message) {
                    alert(productId ? 'Product updated!' : 'Product created!');
                    window.location.href = 'products.html';
                } else {
                    alert('Error saving product');
                }
            } catch (err) {
                console.error(err);
                alert('Server error');
            }
        };

        window.onload = initForm;
    </script>
</body>

</html>

<!-- Admin Orders Management - Desktop -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Orders Management | Bastrika Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e61919",
                        "background-light": "#f8f6f6",
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light text-[#181111] font-display min-h-screen">
    <header class="flex items-center justify-between border-b border-[#e5e7eb] bg-white px-10 py-3 sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <h2 class="text-[#181111] text-lg font-bold leading-tight tracking-tight">Bastrika <span
                    class="text-primary">Admin</span></h2>
            <nav class="flex items-center gap-9">
                <a class="text-[#181111]/60 hover:text-primary text-sm font-medium transition-colors"
                    href="dashboard.html">Dashboard</a>
                <a class="text-[#181111]/60 hover:text-primary text-sm font-medium transition-colors"
                    href="products.html">Products</a>
                <a class="text-primary text-sm font-bold border-b-2 border-primary pb-1" href="orders.html">Orders</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <header class="mb-10">
            <h1 class="text-3xl font-black text-[#181111] tracking-tight">Orders Management</h1>
            <p class="text-slate-500 mt-1">Track and manage customer orders from the heritage collections.</p>
        </header>

        <div class="bg-white rounded-xl shadow-sm border border-[#e5e7eb] overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-[#e5e7eb]">
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Order ID
                            </th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Customer
                            </th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Total</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="divide-y divide-slate-100">
                        <!-- Orders load here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script>
        async function loadOrders() {
            try {
                const orders = await api.getOrders();
                const tbody = document.getElementById('orders-table-body');

                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400">No orders found.</td></tr>';
                    return;
                }

                tbody.innerHTML = orders.map(o => `
                    <tr class="group hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4">
                            <span class="text-xs font-mono font-bold text-slate-400">#${o.id.substring(0, 8)}</span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex flex-col">
                                <span class="font-bold text-slate-900">${o.user_name}</span>
                                <span class="text-xs text-slate-500">${o.user_email}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm font-bold text-slate-900">₹${o.total_price}</td>
                        <td class="px-6 py-4">
                            <select onchange="updateStatus('${o.id}', this.value)" class="text-xs font-bold rounded-full px-3 py-1 border-none focus:ring-1 focus:ring-primary ${getStatusClass(o.order_status)}">
                                <option value="Pending" ${o.order_status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Processing" ${o.order_status === 'Processing' ? 'selected' : ''}>Processing</option>
                                <option value="Shipped" ${o.order_status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                <option value="Delivered" ${o.order_status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                <option value="Cancelled" ${o.order_status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                        </td>
                        <td class="px-6 py-4 text-xs text-slate-500">
                            ${new Date(o.created_at).toLocaleDateString()}
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="viewDetails('${o.id}')" class="p-2 text-slate-400 hover:text-primary transition-colors">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'Pending': return 'bg-amber-100 text-amber-700';
                case 'Shipped': return 'bg-blue-100 text-blue-700';
                case 'Delivered': return 'bg-emerald-100 text-emerald-700';
                case 'Cancelled': return 'bg-rose-100 text-rose-700';
                default: return 'bg-slate-100 text-slate-700';
            }
        }

        async function updateStatus(id, status) {
            try {
                await api.updateOrderStatus(id, status);
                loadOrders();
            } catch (err) {
                alert('Failed to update status');
            }
        }

        window.onload = loadOrders;
    </script>
</body>

</html>
